openapi: 3.0.0
info:
  title: PawConnect API - Fundraiser API
  description: |
    API for managing fundraisers.

    Listing fundraisers is public. Creating one requires the `NGO` or `ADMIN` role and an `approved` NGO.
    Only the user who created a fundraiser, or an `ADMIN`, may update or delete it.
  version: 1.1.0
servers:
  - url: http://localhost:3002/api
    description: Development server

paths:
  /fundraisers:
    get:
      summary: Get all fundraisers
      description: Fetch a list of all fundraisers, with their NGO details populated.
      responses:
        '200':
          description: A list of fundraisers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Fundraiser'
        '500':
          description: Server error
    post:
      summary: Create a new fundraiser
      description: Requires the `NGO` or `ADMIN` role. The referenced NGO must be `approved`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FundraiserInput'
      responses:
        '201':
          description: Fundraiser created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fundraiser'
        '400':
          description: Invalid input
        '401':
          description: Missing, invalid or expired token
        '403':
          description: User lacks the NGO/ADMIN role, or the NGO is not approved

  /fundraisers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID of the fundraiser
        schema:
          type: string
    patch:
      summary: Update a fundraiser
      description: Only the creator or an `ADMIN` may update a fundraiser. `createdBy` cannot be changed.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FundraiserUpdate'
      responses:
        '200':
          description: Fundraiser updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fundraiser'
        '400':
          description: Invalid input
        '401':
          description: Missing, invalid or expired token
        '403':
          description: Not the creator or an admin
        '404':
          description: Fundraiser not found
    delete:
      summary: Delete a fundraiser
      description: Only the creator or an `ADMIN` may delete a fundraiser.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Fundraiser deleted successfully
        '401':
          description: Missing, invalid or expired token
        '403':
          description: Not the creator or an admin
        '404':
          description: Fundraiser not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Fundraiser:
      type: object
      properties:
        _id:
          type: string
        title:
          type: string
          description: The title of the fundraiser
        description:
          type: string
          description: A brief description of the fundraiser
        targetAmount:
          type: number
          description: The target amount for the fundraiser
        collectedAmount:
          type: number
          description: The amount collected so far
        ngo:
          description: The NGO associated with the fundraiser (populated object in GET responses)
          oneOf:
            - type: string
            - type: object
        createdBy:
          type: string
          description: ID of the user who created the fundraiser
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    FundraiserInput:
      type: object
      required:
        - title
        - description
        - targetAmount
        - ngo
      properties:
        title:
          type: string
        description:
          type: string
        targetAmount:
          type: number
        ngo:
          type: string
          description: ID of an approved NGO
    FundraiserUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        targetAmount:
          type: number
        collectedAmount:
          type: number
