name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    env:
      # Keep the MongoDB binary for mongodb-memory-server outside node_modules so it can be cached
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.mongodb-binaries
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: service/package-lock.json

      # mongodb-memory-server downloads a MongoDB binary on first use; reuse it between runs
      - uses: actions/cache@v4
        with:
          path: .mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('service/package-lock.json') }}

      - run: npm ci
      - run: npm test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run build
